# Build Android APK
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip ShiftCalendar_Android_Project.zip

      - name: Build APK
        run: gradle -p ShiftCalendar :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftCalendar-APK
          path: ShiftCalendar/app/build/outputs/apk/debug/app-debug.apk
